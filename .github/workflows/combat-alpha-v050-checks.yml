name: Combat Alpha V0.5.0 full-field overlay checks
on:
  push:
    branches:
      - feature/combat-alpha-v050-field-overlay
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run combat, game save and UI regression tests
        run: npm run test
      - name: Typecheck and build V0.5.0
        run: npm run build
