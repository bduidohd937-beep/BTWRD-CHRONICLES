name: Combat Alpha V0.4 rule checks
on:
  push:
    branches:
      - feature/combat-alpha-v04-rules
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test rules and regressions
        run: npm run test
      - name: Typecheck and production build
        run: npm run build
