name: Combat Alpha V0.3.3 — 3D+ engine verification
on:
  push:
    branches:
      - feature/combat-alpha-v033-3d-battle
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Update dependency lock for Three.js
        run: npm install --package-lock-only --ignore-scripts
      - name: Install
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Typecheck and production build
        run: npm run build
      - name: Persist verified package lock
        if: success()
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock Three.js dependencies [skip ci]"
            git push origin HEAD:feature/combat-alpha-v033-3d-battle
          fi
