name: Combat Alpha V0.5.4.1 field layout
on:
  push:
    branches:
      - feature/combat-alpha-v0541-field-layout
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test combat rules and field layout
        run: npm run test
      - name: Typecheck and build
        run: npm run build
