name: Combat Alpha V0.5.4 UX polish and choice checks
on:
  push:
    branches:
      - feature/combat-alpha-v054-ux-polish
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all combat and UI regression tests
        run: npm run test
      - name: TypeScript check and production build
        run: npm run build
