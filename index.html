<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTWRD: CHRONICLES V0.1</title>
<style>
:root{--bg:#0d0b12;--panel:#171320;--line:#2c2538;--text:#e8e2d4;--dim:#8b8498;--gold:#d9b86c;
--r1:#9aa0a6;--r2:#4aa3ff;--r3:#b86bff;--r4:#ffb21e;--r5:#ff4d6d;--r6:#3ff2e0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1d1530 0,var(--bg) 60%) fixed;color:var(--text);
font-family:"Noto Serif KR","Malgun Gothic",serif;min-height:100vh;padding-bottom:60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;letter-spacing:.08em;color:var(--gold);font-weight:700}
.gem{font-size:18px;color:var(--gold)}
nav{display:flex;gap:8px;padding:14px 20px}
nav button,.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 18px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{border-color:var(--gold);color:var(--gold)}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.main{border-color:var(--gold);color:var(--gold)}
main{padding:0 20px;max-width:1100px;margin:0 auto}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px;align-items:center}
.note{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.card{position:relative;background:linear-gradient(160deg,#241c33,#14101c);border:2px solid var(--c);border-radius:8px;
padding:8px;min-height:190px;display:flex;flex-direction:column;gap:4px;cursor:pointer;box-shadow:0 0 12px -2px var(--c)}
.card .top{display:flex;justify-content:space-between;font-size:12px;color:var(--c)}
.card .nm{font-weight:700;font-size:14px;line-height:1.3}
.card .ty{font-size:11px;color:var(--dim)}
.card .tx{font-size:11px;color:#c5bfd2;flex:1}
.card .st{display:flex;justify-content:space-between;font-size:13px;color:var(--gold)}
.card .cnt{position:absolute;right:6px;bottom:6px;background:#000a;border-radius:10px;padding:0 7px;font-size:12px}
.card .tmp{position:absolute;left:6px;bottom:6px;font-size:10px;color:var(--dim)}
.card.new::after{content:"NEW";position:absolute;top:-8px;right:-4px;background:var(--gold);color:#000;font-size:10px;padding:1px 6px;border-radius:8px}
.card.locked{filter:grayscale(1) brightness(.35);cursor:default;box-shadow:none}
.card.pop{animation:pop .5s both;animation-delay:calc(var(--i)*.12s)}
@keyframes pop{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.card.glow{animation:pop .5s both,pulse 1.6s infinite .6s;animation-delay:calc(var(--i)*.12s),calc(var(--i)*.12s + .6s)}
@keyframes pulse{50%{box-shadow:0 0 28px 4px var(--c)}}
.bar{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--dim);margin-bottom:14px}
.rate{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.rate td,.rate th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
details{margin-top:24px;color:var(--dim)}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
#modal.show{display:flex}
#modal .card{width:min(300px,86vw);min-height:360px;padding:18px;cursor:default;font-size:120%}
#modal .nm{font-size:22px}#modal .tx{font-size:14px}
.tag{font-size:11px;color:#ff9a9a;border:1px solid #ff9a9a55;border-radius:4px;padding:0 5px;margin-left:6px}
@media (prefers-reduced-motion:reduce){.card.pop,.card.glow{animation:none}}
</style>
</head>
<body>
<header>
  <h1>BTWRD: CHRONICLES · V0.1 프로토타입</h1>
  <div class="gem">💎 <span id="gem">0</span> Gem</div>
</header>
<nav>
  <button id="t-sum" class="on">소환</button>
  <button id="t-col">도감</button>
</nav>
<main>
  <section id="v-sum">
    <div class="actions">
      <button class="btn main" id="b1"></button>
      <button class="btn main" id="b11"></button>
      <span class="note" id="msg"></span>
    </div>
    <div class="grid" id="res"></div>
    <details open><summary>소환 확률 (원작 영웅 소환 v2 검토값 · 임시 적용)</summary><table class="rate" id="rt"></table></details>
  </section>
  <section id="v-col" hidden>
    <div class="bar" id="stat"></div>
    <div class="grid" id="col"></div>
  </section>
  <p style="margin-top:30px"><button class="btn" id="reset">데이터 초기화</button></p>
</main>
<div id="modal"></div>

<script>
/* ===== 설정 (임시값은 TEMP 표시) ===== */
const CFG = {
  startGem: 5000,          // TEMP
  single: 100,             // 원작 규칙
  multi: 1000,             // 원작 규칙 (10+1 = 11장)
  multiCount: 11,
  bonusMinRarity: "영웅",  // 10+1 마지막 1장 영웅 이상 (제안)
  saveKey: "btwrd_cardgame_v01"
};
// 확률: 원작 영웅 소환 v2 [REVIEW] / 환급: TEMP
const RARITIES = [
  { name:"일반", rate:39,    refund:10,   color:"var(--r1)" },
  { name:"희귀", rate:35,    refund:30,   color:"var(--r2)" },
  { name:"영웅", rate:22.34, refund:100,  color:"var(--r3)" },
  { name:"전설", rate:2.8,   refund:300,  color:"var(--r4)" },
  { name:"신화", rate:0.75,  refund:800,  color:"var(--r5)" },
  { name:"초월", rate:0.11,  refund:2000, color:"var(--r6)" },
  { name:"???",  rate:0,     refund:5000, color:"#fff" }
];
/* temp:true = 임시 카드 (기획서 미확정) */
const CARDS = [
 // 기획서 확정 샘플 9장 (수치는 임시 밸런스)
 {id:"U001",name:"왕국 병사",rarity:"일반",type:"유닛",cost:1,atk:2,hp:1,text:"효과 없음"},
 {id:"U002",name:"철갑 방패병",rarity:"일반",type:"유닛",cost:2,atk:1,hp:4,text:"도발"},
 {id:"U003",name:"왕국 궁수",rarity:"일반",type:"유닛",cost:3,atk:3,hp:2,text:"소환 시 적 유닛 하나에 피해 1"},
 {id:"U004",name:"왕국 사제",rarity:"일반",type:"유닛",cost:3,atk:1,hp:3,text:"소환 시 아군 하나의 체력 2 회복"},
 {id:"S001",name:"치유의 빛",rarity:"일반",type:"마법",cost:2,text:"아군 유닛 하나의 체력 3 회복"},
 {id:"S002",name:"방패 진형",rarity:"일반",type:"마법",cost:2,text:"아군 유닛 하나에게 도발과 체력 +2 부여"},
 {id:"S003",name:"소우주 붕괴",rarity:"희귀",type:"마법",cost:5,text:"적 유닛 전체에 피해 2"},
 {id:"L001",name:"백철의 기사 아서왕",rarity:"전설",type:"유닛",cost:6,atk:4,hp:8,text:"도발. 처음 받는 피해 2 감소"},
 {id:"M001",name:"성해의 항해자 세렌티아",rarity:"신화",type:"유닛",cost:7,atk:3,hp:6,text:"소환 시 적 유닛 하나를 다음 턴까지 행동 불가"},
 // 임시 카드 15장
 {id:"U005",name:"견습 창병",rarity:"일반",type:"유닛",cost:2,atk:2,hp:2,text:"효과 없음",temp:1},
 {id:"U006",name:"정찰병",rarity:"일반",type:"유닛",cost:1,atk:1,hp:2,text:"소환 시 카드 1장 뽑기",temp:1},
 {id:"R001",name:"왕국 기병",rarity:"희귀",type:"유닛",cost:4,atk:4,hp:3,text:"소환 턴에 공격 가능",temp:1},
 {id:"R002",name:"성벽 수호자",rarity:"희귀",type:"유닛",cost:4,atk:2,hp:6,text:"도발",temp:1},
 {id:"R003",name:"연막 사제",rarity:"희귀",type:"유닛",cost:3,atk:2,hp:3,text:"소환 시 아군 전체 체력 1 회복",temp:1},
 {id:"R004",name:"전장의 함성",rarity:"희귀",type:"마법",cost:3,text:"아군 유닛 전체 공격력 +1 (이번 턴)",temp:1},
 {id:"H001",name:"성기사 단장",rarity:"영웅",type:"유닛",cost:5,atk:4,hp:5,text:"도발. 소환 시 아군 하나의 체력 3 회복",temp:1},
 {id:"H002",name:"왕국 저격수",rarity:"영웅",type:"유닛",cost:5,atk:5,hp:3,text:"소환 시 적 유닛 하나에 피해 3",temp:1},
 {id:"H003",name:"전술 참모",rarity:"영웅",type:"유닛",cost:4,atk:2,hp:4,text:"소환 시 카드 2장 뽑기",temp:1},
 {id:"H004",name:"정화의 종소리",rarity:"영웅",type:"마법",cost:4,text:"아군 유닛 하나의 체력을 최대로 회복",temp:1},
 {id:"H005",name:"왕실 근위대장",rarity:"영웅",type:"유닛",cost:6,atk:5,hp:6,text:"아군 유닛이 공격받을 때 피해 1 감소",temp:1},
 {id:"L002",name:"왕국의 대원수",rarity:"전설",type:"유닛",cost:7,atk:6,hp:7,text:"아군 전체 공격력 +1",temp:1},
 {id:"L003",name:"흑철의 처형자",rarity:"전설",type:"유닛",cost:6,atk:7,hp:4,text:"유닛을 처치하면 즉시 한 번 더 공격",temp:1},
 {id:"M002",name:"황혼의 사제 아벨리스",rarity:"신화",type:"유닛",cost:7,atk:2,hp:7,text:"턴 종료 시 아군 전체 체력 2 회복, 상태이상 정화",temp:1},
 {id:"T001",name:"불변의 에이온",rarity:"초월",type:"유닛",cost:9,atk:5,hp:10,text:"적 유닛은 매 턴 하나만 행동 가능. 아군 전체 보호",temp:1}
];

/* ===== 상태 ===== */
let S = load();
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(CFG.saveKey));
    if(d && typeof d.gem === "number") return d;
  }catch(e){}
  return {gem:CFG.startGem, own:{}, pulls:0};
}
function save(){ try{ localStorage.setItem(CFG.saveKey, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const rar = n => RARITIES.find(r => r.name === n);

/* ===== 뽑기 로직 ===== */
function rollRarity(minName){
  // 풀에 실제 카드가 있는 등급만 대상, minName 이상만 허용
  const minIdx = minName ? RARITIES.findIndex(r => r.name === minName) : 0;
  const pool = RARITIES.filter((r,i) => i >= minIdx && r.rate > 0 && CARDS.some(c => c.rarity === r.name));
  const total = pool.reduce((a,r) => a + r.rate, 0);
  let x = Math.random() * total;
  for(const r of pool){ if((x -= r.rate) < 0) return r.name; }
  return pool[pool.length-1].name;
}
function rollCard(minName){
  const rr = rollRarity(minName);
  const list = CARDS.filter(c => c.rarity === rr);
  return list[Math.floor(Math.random() * list.length)];
}
function summon(n, cost){
  if(S.gem < cost){ $("msg").textContent = "Gem이 부족합니다."; return; }
  S.gem -= cost; S.pulls += n;
  const out = []; let refund = 0;
  for(let i = 0; i < n; i++){
    const bonus = (n === CFG.multiCount && i === n - 1);
    const c = rollCard(bonus ? CFG.bonusMinRarity : null);
    const first = !S.own[c.id];
    if(!first) refund += rar(c.rarity).refund;
    S.own[c.id] = (S.own[c.id] || 0) + 1;
    out.push({c, first});
  }
  S.gem += refund; save();
  $("msg").textContent = refund ? `중복 환급 +${refund} Gem` : "";
  showResult(out); renderTop();
}

/* ===== 렌더 ===== */
function cardHTML(c, o = {}){
  const r = rar(c.rarity);
  const stat = c.type === "유닛" ? `<div class="st"><span>⚔ ${c.atk}</span><span>♥ ${c.hp}</span></div>` : "";
  return `<div class="card ${o.cls||""}" style="--c:${r.color};--i:${o.i||0}" data-id="${c.id}">
    <div class="top"><span>${c.rarity}</span><span>💧${c.cost}</span></div>
    <div class="nm">${c.name}</div><div class="ty">${c.type}</div>
    <div class="tx">${c.text}</div>${stat}
    ${c.temp ? '<span class="tmp">임시</span>' : ""}
    ${o.count > 1 ? `<span class="cnt">x${o.count}</span>` : ""}</div>`;
}
function showResult(out){
  $("res").innerHTML = out.map((o,i) => {
    const hi = RARITIES.findIndex(r => r.name === o.c.rarity) >= 3;
    return cardHTML(o.c, {i, cls:"pop " + (hi ? "glow " : "") + (o.first ? "new" : "")});
  }).join("");
}
function renderTop(){ $("gem").textContent = S.gem.toLocaleString(); $("b1").disabled = S.gem < CFG.single; $("b11").disabled = S.gem < CFG.multi; }
function renderCol(){
  const owned = CARDS.filter(c => S.own[c.id]).length;
  const dup = Object.values(S.own).reduce((a,n) => a + n - 1, 0);
  $("stat").innerHTML = `<span>수집 ${owned} / ${CARDS.length}</span><span>총 소환 ${S.pulls}회</span><span>중복 ${dup}장</span>`;
  const order = RARITIES.map(r => r.name);
  const sorted = [...CARDS].sort((a,b) => order.indexOf(b.rarity) - order.indexOf(a.rarity));
  $("col").innerHTML = sorted.map(c => S.own[c.id]
    ? cardHTML(c, {count:S.own[c.id]})
    : `<div class="card locked" style="--c:#555"><div class="top"><span>${c.rarity}</span></div><div class="nm">???</div></div>`).join("");
}
function renderRates(){
  $("rt").innerHTML = "<tr><th>등급</th><th>확률</th><th>카드 수</th><th>중복 환급(임시)</th></tr>" +
    RARITIES.map(r => `<tr><td style="color:${r.color}">${r.name}</td><td>${r.rate}%</td><td>${CARDS.filter(c=>c.rarity===r.name).length}</td><td>${r.refund}</td></tr>`).join("") +
    `<tr><td colspan="4" class="note">10+1 소환의 마지막 1장은 ${CFG.bonusMinRarity} 이상. ???은 일반 소환에서 나오지 않음. 카드 풀에 없는 등급은 자동 제외.</td></tr>`;
}

/* ===== 이벤트 ===== */
function tab(on){
  $("v-sum").hidden = on !== "sum"; $("v-col").hidden = on !== "col";
  $("t-sum").classList.toggle("on", on === "sum"); $("t-col").classList.toggle("on", on === "col");
  if(on === "col") renderCol();
}
$("t-sum").onclick = () => tab("sum");
$("t-col").onclick = () => tab("col");
$("b1").onclick = () => summon(1, CFG.single);
$("b11").onclick = () => summon(CFG.multiCount, CFG.multi);
$("b1").textContent = `1회 소환 (${CFG.single} Gem)`;
$("b11").textContent = `10+1 소환 (${CFG.multi} Gem)`;
$("reset").onclick = () => { if(confirm("모든 진행 데이터를 초기화할까요?")){ S = {gem:CFG.startGem, own:{}, pulls:0}; save(); $("res").innerHTML = ""; $("msg").textContent = ""; renderTop(); renderCol(); } };
document.addEventListener("click", e => {
  const m = $("modal");
  if(e.target.closest("#modal .card")) return;
  if(m.classList.contains("show")){ m.classList.remove("show"); return; }
  const el = e.target.closest(".card");
  if(!el || el.classList.contains("locked")) return;
  const c = CARDS.find(x => x.id === el.dataset.id); if(!c) return;
  m.innerHTML = cardHTML(c, {count:S.own[c.id]}).replace('class="card', 'class="card') +
    `<div style="position:absolute;bottom:30px;color:var(--dim);font-size:12px">${c.id}${c.temp ? " · 임시 카드" : " · 기획서 카드(수치 임시)"}</div>`;
  m.classList.add("show");
});
renderTop(); renderRates(); renderCol();
</script>
</body>
</html>
